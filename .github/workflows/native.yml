name: Native Gazebo integration (manual)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native test duration
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build and native dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y build-essential cmake python3-colcon-common-extensions python3-numpy python3-scipy python3-matplotlib ros-jazzy-ros-gz ros-jazzy-rviz2 ros-jazzy-gz-sim-vendor ros-jazzy-gz-plugin-vendor ros-jazzy-gz-transport-vendor ros-jazzy-gz-msgs-vendor ros-jazzy-gz-gui-vendor ros-jazzy-gz-rendering-vendor qtbase5-dev qtdeclarative5-dev
      - name: Build all packages
        shell: bash
        run: bash scripts/build.sh --executor sequential
      - name: Verify interfaces
        shell: bash
        run: bash scripts/verify.sh --ros
      - name: Run isolated headless mission
        shell: bash
        env:
          REDCHO_NATIVE_SUITE: ${{ inputs.suite }}
        run: bash scripts/test_native.sh "$REDCHO_NATIVE_SUITE"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gazebo-results
          path: |
            results/native_*/
            log/
